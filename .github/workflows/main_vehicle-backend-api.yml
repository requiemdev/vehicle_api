# Build and deploy the ASP.NET Core API to Azure App Service.

name: Build and deploy API to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'API/Backend_API/**'
      - '.github/workflows/main_vehicle-backend-api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: API/Backend_API/Backend_API/Backend_API.csproj
  PUBLISH_DIR: publish-api
  AZURE_WEBAPP_NAME: vehicle-backend-api

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        run: dotnet restore "${{ env.API_PROJECT }}"

      - name: Build
        shell: pwsh
        run: dotnet build "${{ env.API_PROJECT }}" --configuration Release --no-restore

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish "${{ env.API_PROJECT }}" `
            --configuration Release `
            --no-restore `
            --output "${{ env.PUBLISH_DIR }}"

      - name: Verify deployment package
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.PUBLISH_DIR }}\Backend_API.dll")) {
            throw 'Backend_API.dll is missing from the publish output.'
          }

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ${{ env.PUBLISH_DIR }}

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_594F48C2AA534EED88FE0B7E8F166A93 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7882ECEE29E04A4587899802BD9414C9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_52AF4169D19F46AD80AAA31932EEAF26 }}

      - name: Deploy Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ${{ env.PUBLISH_DIR }}
